<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المخازن والمواقع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبات الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-6 max-w-6xl">
        <!-- الشريط العلوي ومعلومات المستخدم -->
        <header class="bg-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <div>
                حياك الله، <span id="displayUser" class="font-bold text-blue-600"></span> | 
                القسم: <span id="displayDept" class="font-bold text-gray-700"></span>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">تسجيل الخروج</button>
        </header>

        <!-- نموذج إضافة مادة مع تحديد مكان التخزين -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">إضافة مادة جديدة وتحديد مكانها</h2>
            <form id="itemForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="text" id="itemName" placeholder="اسم المادة" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="text" id="itemLocation" placeholder="مكان التخزين (مثل: الثلاجة 2، الرف أ)" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="number" id="itemQuantity" placeholder="الكمية في هذا المكان" min="1" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="date" id="itemExpiryDate" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition font-bold">حفظ المادة</button>
            </form>
        </div>

        <!-- أزرار التصفية والتصدير لـ PDF -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">مخزون القسم ومواقع التخزين</h2>
            <button onclick="exportPDF()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition flex items-center gap-1 font-bold text-sm">
                📄 تصدير كشف القسم (PDF)
            </button>
        </div>

        <!-- جدول عرض المواد والمواقع -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full text-right border-collapse">
                <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
                    <tr>
                        <th class="p-3">اسم المادة</th>
                        <th class="p-3">مكان التخزين</th>
                        <th class="p-3">الكمية</th>
                        <th class="p-3">تاريخ الانتهاء</th>
                        <th class="p-3">الحالة</th>
                        <th class="p-3">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody" class="divide-y divide-gray-200">
                    <!-- البيانات تعبأ برمجياً -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
