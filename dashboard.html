<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المواد السحابية والمواقع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwt1K6LBGJmyTjx_219kc9xmZYldJ8rEo",
            authDomain: "ex-date-1db53.firebaseapp.com",
            projectId: "ex-date-1db53",
            storageBucket: "ex-date-1db53.firebasestorage.app",
            messagingSenderId: "367695041348",
            appId: "1:367695041348:web:d9d4695dd70606fb9dbd11",
            measurementId: "G-9CHBWJ6VGG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentUser = sessionStorage.getItem('currentUser');
        const currentDept = sessionStorage.getItem('currentDept');

        if (!currentUser || !currentDept) {
            window.location.href = 'index.html';
        }

        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('displayDept').innerText = currentDept;

        window.logout = function() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        function checkExpiryStatus(expiryDateStr) {
            const today = new Date();
            const expiryDate = new Date(expiryDateStr);
            const diffTime = expiryDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `<span class="bg-red-100 text-red-800 text-xs px-2.5 py-1 rounded font-bold">منتهية الصلاحية (مضى ${Math.abs(diffDays)} يوم)</span>`;
            } else if (diffDays <= 30) {
                return `<span class="bg-yellow-100 text-yellow-800 text-xs px-2.5 py-1 rounded font-bold">قريب الانتهاء (متبقي ${diffDays} يوم)</span>`;
            } else {
                return `<span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded font-bold">سارية المفعول (متبقي ${diffDays} يوم)</span>`;
            }
        }

        let globalInventory = [];

        async function renderInventory() {
            const tableBody = document.getElementById('itemTableBody');
            tableBody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500 font-bold">جاري تحميل البيانات من السحابة...</td></tr>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "inventory"));
                globalInventory = [];
                
                querySnapshot.forEach((docSnap) => {
                    globalInventory.push({ id: docSnap.id, ...docSnap.data() });
                });

                tableBody.innerHTML = '';
                const deptInventory = globalInventory.filter(item => item.department === currentDept);

                if (deptInventory.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-gray-500">لا توجد مواد مسجلة في هذا القسم حالياً</td></tr>`;
                    return;
                }

                deptInventory.forEach((item) => {
                    const statusBadge = checkExpiryStatus(item.expiryDate);
                    tableBody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-3">
                                <img src="${item.image}" alt="صورة المادة" class="w-12 h-12 object-cover rounded-md border shadow-sm">
                            </td>
                            <td class="p-3 text-blue-700 font-semibold"><span class="bg-blue-50 border border-blue-200 px-2.5 py-1 rounded text-xs">${item.location}</span></td>
                            <td class="p-3 text-gray-700 font-bold">${item.quantity}</td>
                            <td class="p-3 text-gray-600 font-mono">${item.expiryDate}</td>
                            <td class="p-3">${statusBadge}</td>
                            <td class="p-3"><button onclick="deleteItem('${item.id}')" class="text-red-600 hover:text-red-800 font-bold text-sm">حذف</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-4 text-red-500">خطأ في الاتصال بقاعدة البيانات</td></tr>`;
            }
        }

        window.addItem = function(e) {
            e.preventDefault();
            const imageFile = document.getElementById('itemImageFile').files[0];
            const location = document.getElementById('itemLocation').value.trim();
            const quantity = parseInt(document.getElementById('itemQuantity').value);
            const expiryDate = document.getElementById('itemExpiryDate').value;

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    const base64Image = event.target.result;
                    
                    // زر مؤقت يوضح جاري الحفظ
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    submitBtn.innerText = "جاري الحفظ بالسحابة...";
                    submitBtn.disabled = true;

                    await addDoc(collection(db, "inventory"), {
                        image: base64Image,
                        location,
                        department: currentDept,
                        quantity,
                        expiryDate
                    });

                    document.getElementById('itemForm').reset();
                    submitBtn.innerText = "حفظ للسحابة";
                    submitBtn.disabled = false;
                    renderInventory();
                };
                reader.readAsDataURL(imageFile);
            }
        }

        window.deleteItem = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذه المادة؟')) {
                await deleteDoc(doc(db, "inventory", id));
                renderInventory();
            }
        }

        window.exportPDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text(`Inventory Report - ${currentDept}`, 14, 20);
            doc.setFontSize(12);
            doc.text(`Generated by: ${currentUser} | Date: ${new Date().toLocaleDateString()}`, 14, 28);

            const deptInventory = globalInventory.filter(item => item.department === currentDept);
            const tableData = deptInventory.map((item, i) => [
                i + 1, 
                item.location, 
                item.quantity, 
                item.expiryDate
            ]);

            doc.autoTable({
                startY: 35,
                head: [['#', 'Location', 'Quantity', 'Expiry Date']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [41, 128, 185] }
            });

            doc.save(`${currentDept}-Inventory-Report.pdf`);
        }

        window.onload = renderInventory;
        window.addItem = addItem;
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-6 max-w-6xl">
        <header class="bg-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <div>
                حياك الله، <span id="displayUser" class="font-bold text-blue-600"></span> | 
                القسم: <span id="displayDept" class="font-bold text-gray-700"></span>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600 font-bold">تسجيل الخروج</button>
        </header>

        <!-- نموذج الإضافة (كاميرا ومواقع) -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">إضافة مادة جديدة (كاميرا أو ملف من الجهاز)</h2>
            <form id="itemForm" onsubmit="addItem(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">صورة المادة:</label>
                    <input type="file" id="itemImageFile" accept="image/*" capture="environment" required class="border p-1.5 rounded w-full text-xs bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">مكان التخزين:</label>
                    <input type="text" id="itemLocation" placeholder="مثال: الثلاجة 1" required class="border p-2.5 rounded w-full text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">الكمية:</label>
                    <input type="number" id="itemQuantity" placeholder="الكمية" min="1" required class="border p-2.5 rounded w-full text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">تاريخ الانتهاء:</label>
                    <input type="date" id="itemExpiryDate" required class="border p-2.5 rounded w-full text-sm">
                </div>
                <div class="flex items-end pt-5 md:pt-0">
                    <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700 font-bold text-sm shadow-md">حفظ للسحابة</button>
                </div>
            </form>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">مخزون القسم والتنبيهات الحية</h2>
            <button onclick="exportPDF()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold text-sm shadow-md">
                📄 تصدير كشف القسم (PDF)
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full text-right border-collapse">
                <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
                    <tr>
                        <th class="p-3">صورة المادة</th>
                        <th class="p-3">مكان التخزين</th>
                        <th class="p-3">الكمية</th>
                        <th class="p-3">تاريخ الانتهاء</th>
                        <th class="p-3">حالة الصلاحية والأيام</th>
                        <th class="p-3">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody" class="divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
