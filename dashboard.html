<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المخزون والتنبيهات الحية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-6 max-w-6xl">
        <header class="bg-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <div>
                حياك الله، <span id="displayUser" class="font-bold text-blue-600"></span> | 
                القسم: <span id="displayDept" class="font-bold text-gray-700"></span>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600 font-bold">تسجيل الخروج</button>
        </header>

        <!-- قسم مسح الباركود وإضافة المادة -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">إضافة مادة عبر مسح الباركود بالكاميرا</h2>
            
            <div class="mb-4">
                <button type="button" onclick="startScanner()" class="bg-indigo-600 text-white px-4 py-2 rounded font-bold text-sm shadow hover:bg-indigo-700">
                    📷 فتح الكاميرا لمسح الباركود
                </button>
                <div id="reader" class="w-full max-w-md mt-3"></div>
            </div>

            <form id="itemForm" onsubmit="addItem(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">رقم الباركود:</label>
                    <input type="text" id="itemBarcode" placeholder="امسح أو اكتب الباركود" required class="border p-2.5 rounded w-full text-sm bg-gray-50 font-mono" onblur="lookupBarcode(this.value)">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">اسم الصنف (مسترجع):</label>
                    <input type="text" id="itemName" placeholder="اسم الصنف من الشيت" required class="border p-2.5 rounded w-full text-sm bg-gray-100 font-bold text-blue-800">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">مكان التخزين:</label>
                    <input type="text" id="itemLocation" placeholder="مثال: الثلاجة 1" required class="border p-2.5 rounded w-full text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">الكمية:</label>
                    <input type="number" id="itemQuantity" placeholder="الكمية" min="1" required class="border p-2.5 rounded w-full text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-bold">تاريخ الانتهاء:</label>
                    <input type="date" id="itemExpiryDate" required class="border p-2.5 rounded w-full text-sm">
                </div>
                <div class="md:col-span-5 flex justify-end mt-2">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700 font-bold text-sm shadow-md">حفظ المادة وإضافتها للقائمة</button>
                </div>
            </form>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">مخزون القسم والتنبيهات الحية</h2>
            <button onclick="exportPDF()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold text-sm shadow-md">
                📄 تصدير كشف القسم (PDF)
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full text-right border-collapse">
                <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
                    <tr>
                        <th class="p-3">الباركود</th>
                        <th class="p-3">اسم الصنف</th>
                        <th class="p-3">مكان التخزين</th>
                        <th class="p-3">الكمية</th>
                        <th class="p-3">تاريخ الانتهاء</th>
                        <th class="p-3">حالة الصلاحية والتنبيهات</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody" class="divide-y divide-gray-200">
                    <tr><td colspan="6" class="text-center p-6 text-gray-500">جاري تحميل بيانات القسم...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby1iPT5STsIz8Upzi5HWGbCXfkGJ5GU5_n7UXnnwyo2ej3yUnlsGfd4VcqWxTMdH0Wr/exec";

        const currentUser = sessionStorage.getItem('currentUser');
        const currentDept = sessionStorage.getItem('currentDept');

        if (!currentUser || !currentDept) {
            window.location.href = 'index.html';
        }

        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('displayDept').innerText = currentDept;

        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        function startScanner() {
            const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render(onScanSuccess, onScanFailure);

            function onScanSuccess(decodedText) {
                document.getElementById('itemBarcode').value = decodedText;
                scanner.clear();
                document.getElementById('reader').innerHTML = "";
                lookupBarcode(decodedText);
            }

            function onScanFailure(error) {}
        }

        async function lookupBarcode(barcode) {
            if (!barcode) return;
            try {
                const response = await fetch(`${WEB_APP_URL}?barcode=${barcode}`);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('itemName').value = data.name;
                    if(data.location) document.getElementById('itemLocation').value = data.location;
                } else {
                    document.getElementById('itemName').value = "";
                    alert("الباركود غير موجود في جوجل شيت، يرجى كتابة اسم الصنف يدوياً.");
                }
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        function checkExpiryStatus(expiryDateStr) {
            const today = new Date();
            const expiryDate = new Date(expiryDateStr);
            const diffTime = expiryDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `<span class="bg-red-100 text-red-800 text-xs px-2.5 py-1 rounded font-bold">منتهية الصلاحية (مضى ${Math.abs(diffDays)} يوم)</span>`;
            } else if (diffDays <= 30) {
                return `<span class="bg-yellow-100 text-yellow-800 text-xs px-2.5 py-1 rounded font-bold">قريب الانتهاء (متبقي ${diffDays} يوم)</span>`;
            } else {
                return `<span class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded font-bold">سارية المفعول (متبقي ${diffDays} يوم)</span>`;
            }
        }

        // تحميل وعرض المواد الخاصة بالقسم محلياً ومعالجتها
        async function loadInventory() {
            const tableBody = document.getElementById('itemTableBody');
            let localData = JSON.parse(localStorage.getItem('supermarket_inventory') || '[]');
            
            tableBody.innerHTML = '';
            const deptItems = localData.filter(item => item.department === currentDept);

            if (deptItems.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-gray-500">لا توجد مواد مسجلة في هذا القسم حتى الآن</td></tr>`;
                return;
            }

            deptItems.forEach((item) => {
                const statusBadge = checkExpiryStatus(item.expiryDate);
                tableBody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-mono text-sm">${item.barcode}</td>
                        <td class="p-3 font-bold text-blue-800">${item.name}</td>
                        <td class="p-3 text-gray-700">${item.location}</td>
                        <td class="p-3 font-bold">${item.quantity}</td>
                        <td class="p-3 font-mono text-gray-600">${item.expiryDate}</td>
                        <td class="p-3">${statusBadge}</td>
                    </tr>
                `;
            });
        }

        async function addItem(e) {
            e.preventDefault();
            const barcode = document.getElementById('itemBarcode').value.trim();
            const name = document.getElementById('itemName').value.trim();
            const location = document.getElementById('itemLocation').value.trim();
            const quantity = parseInt(document.getElementById('itemQuantity').value);
            const expiryDate = document.getElementById('itemExpiryDate').value;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = "جاري الحفظ...";
            submitBtn.disabled = true;

            const newItem = { barcode, name, department: currentDept, location, quantity, expiryDate };

            try {
                // 1. الحفظ في Google Sheet سحابياً
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newItem)
                });

                // 2. الحفظ في الذاكرة المحلية (LocalStorage) لتظهر فوراً في جدول القائمة والتنبيهات
                let localData = JSON.parse(localStorage.getItem('supermarket_inventory') || '[]');
                localData.push(newItem);
                localStorage.setItem('supermarket_inventory', JSON.stringify(localData));

                alert("تم حفظ المادة وإضافتها للقائمة والتنبيهات بنجاح!");
                document.getElementById('itemForm').reset();
                loadInventory();
            } catch (error) {
                console.error("خطأ أثناء الحفظ:", error);
                alert("حدث خطأ أثناء الحفظ!");
            } finally {
                submitBtn.innerText = "حفظ المادة وإضافتها للقائمة";
                submitBtn.disabled = false;
            }
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text(`Inventory Report - ${currentDept}`, 14, 20);
            
            let localData = JSON.parse(localStorage.getItem('supermarket_inventory') || '[]');
            let deptItems = localData.filter(item => item.department === currentDept);
            
            const tableData = deptItems.map((item, i) => [
                i + 1, item.barcode, item.name, item.location, item.quantity, item.expiryDate
            ]);

            doc.autoTable({
                startY: 35,
                head: [['#', 'Barcode', 'Name', 'Location', 'Quantity', 'Expiry Date']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [41, 128, 185] }
            });

            doc.save(`${currentDept}-Inventory-Report.pdf`);
        }

        window.onload = loadInventory;
    </script>
</body>
</html>
