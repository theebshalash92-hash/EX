<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المواد بالصور والمواقع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-6 max-w-6xl">
        <!-- الشريط العلوي ومعلومات المستخدم -->
        <header class="bg-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <div>
                حياك الله، <span id="displayUser" class="font-bold text-blue-600"></span> | 
                القسم: <span id="displayDept" class="font-bold text-gray-700"></span>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">تسجيل الخروج</button>
        </header>

        <!-- نموذج إضافة مادة مع رابط الصورة -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">إضافة مادة جديدة (صورة، مكان، كمية وتاريخ)</h2>
            <form id="itemForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="url" id="itemImage" placeholder="رابط صورة المادة (URL)" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="text" id="itemLocation" placeholder="مكان التخزين (مثال: الثلاجة 1)" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="number" id="itemQuantity" placeholder="الكمية" min="1" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="date" id="itemExpiryDate" required class="border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                
                <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-bold">حفظ المادة</button>
            </form>
        </div>

        <!-- أزرار التصفية والتصدير -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">مخزون القسم والصور</h2>
            <button onclick="exportPDF()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold text-sm">
                📄 تصدير كشف القسم (PDF)
            </button>
        </div>

        <!-- جدول عرض المواد والصور -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full text-right border-collapse">
                <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
                    <tr>
                        <th class="p-3">صورة المادة</th>
                        <th class="p-3">مكان التخزين</th>
                        <th class="p-3">الكمية</th>
                        <th class="p-3">تاريخ الانتهاء</th>
                        <th class="p-3">الحالة</th>
                        <th class="p-3">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody" class="divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <script>
        const currentUser = sessionStorage.getItem('currentUser');
        const currentDept = sessionStorage.getItem('currentDept');

        if (!currentUser || !currentDept) {
            window.location.href = 'index.html';
        }

        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('displayDept').innerText = currentDept;

        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        const form = document.getElementById('itemForm');
        const tableBody = document.getElementById('itemTableBody');

        function checkExpiryStatus(expiryDateStr) {
            const today = new Date();
            const expiryDate = new Date(expiryDateStr);
            const diffTime = expiryDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `<span class="bg-red-100 text-red-800 text-xs px-2 py-1 rounded font-bold">منتهية الصلاحية</span>`;
            } else if (diffDays <= 30) {
                return `<span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded font-bold">قريب الانتهاء (${diffDays} يوم)</span>`;
            } else {
                return `<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded">سارية المفعول</span>`;
            }
        }

        function renderInventory() {
            tableBody.innerHTML = '';
            const deptInventory = inventory.filter(item => item.department === currentDept);

            if (deptInventory.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-4 text-gray-500">لا توجد مواد مسجلة في هذا القسم حالياً</td></tr>`;
                return;
            }

            deptInventory.forEach((item, index) => {
                const statusBadge = checkExpiryStatus(item.expiryDate);
                const globalIndex = inventory.findIndex(inv => inv === item);
                
                tableBody.innerHTML += `
                    <tr>
                        <td class="p-3">
                            <img src="${item.image}" alt="صورة المادة" class="w-12 h-12 object-cover rounded-md border shadow-sm">
                        </td>
                        <td class="p-3 text-blue-700 font-semibold"><span class="bg-blue-50 border border-blue-200 px-2 py-1 rounded text-xs">${item.location}</span></td>
                        <td class="p-3 text-gray-700 font-bold">${item.quantity}</td>
                        <td class="p-3 text-gray-600">${item.expiryDate}</td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3"><button onclick="deleteItem(${globalIndex})" class="text-red-600 hover:text-red-800 text-sm">حذف</button></td>
