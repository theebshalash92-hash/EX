<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المخازن والتنبيهات الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div id="alertBanner" class="bg-red-600 text-white text-center py-2 px-4 font-bold text-sm hidden shadow-md">
        ⚠️ تنبيه عاجل: توجد مواد في قسمك تقترب من الانتهاء خلال أقل من 10 أيام! يرجى مراجعتها فوراً.
    </div>

    <div class="container mx-auto p-4 md:p-6 max-w-7xl">
        <header class="bg-white p-4 rounded-xl shadow-md mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-sm md:text-base text-gray-700">
                حياك الله، <span id="displayUser" class="font-bold text-blue-600">وليد</span> | 
                القسم: <span id="displayDept" class="font-bold text-gray-800 bg-gray-100 px-2.5 py-1 rounded">منظفات</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportPDF()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-emerald-700 transition">
                    📄 تصدير تقرير القسم (PDF)
                </button>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-red-600 transition">
                    تسجيل الخروج
                </button>
            </div>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">إضافة مادة جديدة (قارئ باركود متطور 1D + 2D)</h2>
            
            <div class="mb-6 flex flex-wrap gap-3 items-center">
                <button type="button" onclick="startScanner()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-bold text-sm shadow hover:bg-indigo-700 transition flex items-center gap-2">
                    📷 تشغيل كاميرا الباركود (Barcode / QR)
                </button>
                <button type="button" onclick="fetchSheetData()" class="bg-gray-800 text-white px-4 py-2.5 rounded-lg font-bold text-sm shadow hover:bg-black transition">
                    🔄 مزامنة وجلب الأصناف من الشيت
                </button>
                <div id="reader" class="w-full max-w-md mt-3 border rounded-lg overflow-hidden shadow-inner"></div>
            </div>

            <form id="itemForm" onsubmit="addItem(event)" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">رقم الباركود:</label>
                    <input type="text" id="itemBarcode" placeholder="امسح أو اكتب الباركود" required class="border p-2.5 rounded-lg w-full text-sm bg-gray-50 font-mono focus:ring-2 focus:ring-blue-500" oninput="lookupBarcodeLocally(this.value)">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم الصنف:</label>
                    <input type="text" id="itemName" placeholder="اكتب أو سيُجلب تلقائياً" required class="border p-2.
