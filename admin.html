<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - الإدارة السحابية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwt1K6LBGJmyTjx_219kc9xmZYldJ8rEo",
            authDomain: "ex-date-1db53.firebaseapp.com",
            projectId: "ex-date-1db53",
            storageBucket: "ex-date-1db53.firebasestorage.app",
            messagingSenderId: "367695041348",
            appId: "1:367695041348:web:d9d4695dd70606fb9dbd11",
            measurementId: "G-9CHBWJ6VGG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (sessionStorage.getItem('userRole') !== 'admin') {
            window.location.href = 'index.html';
        }

        window.logout = function() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadAdminData() {
            // تحميل الأقسام
            const deptSnapshot = await getDocs(collection(db, "departments"));
            const deptListDiv = document.getElementById('deptList');
            const userDeptSelect = document.getElementById('userDeptSelect');
            deptListDiv.innerHTML = '';
            userDeptSelect.innerHTML = '<option value="">اختر القسم المسؤول عنه</option>';

            deptSnapshot.forEach((docSnap) => {
                const dept = docSnap.data().name;
                deptListDiv.innerHTML += `<span class="bg-blue-50 text-blue-800 border border-blue-200 px-3 py-1 rounded text-sm">${dept}</span>`;
                userDeptSelect.innerHTML += `<option value="${dept}">${dept}</option>`;
            });

            // تحميل المستخدمين
            const usersSnapshot = await getDocs(collection(db, "users"));
            const usersTableBody = document.getElementById('usersTableBody');
            usersTableBody.innerHTML = '';
            
            usersSnapshot.forEach((docSnap) => {
                const usr = docSnap.data();
                const docId = docSnap.id;
                if (usr.role === 'admin') return;

                usersTableBody.innerHTML += `
                    <tr>
                        <td class="p-3">${usr.username}</td>
                        <td class="p-3 font-mono">••••</td>
                        <td class="p-3">${usr.dept}</td>
                        <td class="p-3"><button onclick="deleteUser('${docId}')" class="text-red-600 hover:text-red-800">حذف</button></td>
                    </tr>
                `;
            });
        }

        window.addDepartment = async function(e) {
            e.preventDefault();
            const name = document.getElementById('newDeptName').value.trim();
            if (!name) return;

            await addDoc(collection(db, "departments"), { name });
            document.getElementById('newDeptName').value = '';
            loadAdminData();
        }

        window.addUser = async function(e) {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim();
            const pass = document.getElementById('newPassword').value.trim();
            const dept = document.getElementById('userDeptSelect').value;

            await addDoc(collection(db, "users"), { username, pass, dept, role: 'employee' });
            document.getElementById('userForm').reset();
            loadAdminData();
        }

        window.deleteUser = async function(docId) {
            if (confirm('هل أنت متأكد من حذف هذا المستخدم؟')) {
                await deleteDoc(doc(db, "users", docId));
                loadAdminData();
            }
        }

        window.onload = loadAdminData;
        window.addDepartment = addDepartment;
        window.addUser = addUser;
    </script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-6 max-w-5xl">
        <header class="bg-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">لوحة تحكم المشرف (سحابي متزامن)</h1>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">تسجيل الخروج</button>
        </header>

        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">إضافة قسم جديد</h2>
            <form onsubmit="addDepartment(event)" class="flex gap-4">
                <input type="text" id="newDeptName" placeholder="اسم القسم الجديد" required class="border p-2 rounded flex-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">إضافة القسم</button>
            </form>
            <div class="mt-4">
                <h3 class="text-sm font-bold text-gray-600 mb-2">الأقسام السحابية الحالية:</h3>
                <div id="deptList" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">إضافة مستخدم / موظف جديد</h2>
            <form id="userForm" onsubmit="addUser(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="newUsername" placeholder="اسم المستخدم" required class="border p-2 rounded">
                <input type="password" id="newPassword" placeholder="كلمة المرور" required class="border p-2 rounded">
                <select id="userDeptSelect" required class="border p-2 rounded bg-white">
                    <option value="">اختر القسم المسؤول عنه</option>
                </select>
                <button type="submit" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">حفظ المستخدم</button>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden p-4">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">المستخدمون المسجلون بالسحابة</h2>
            <table class="w-full text-right border-collapse">
                <thead class="bg-gray-100 text-gray-600 text-sm">
                    <tr>
                        <th class="p-3">اسم المستخدم</th>
                        <th class="p-3">كلمة المرور</th>
                        <th class="p-3">القسم</th>
                        <th class="p-3">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody" class="divide-y divide-gray-200 text-sm"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
