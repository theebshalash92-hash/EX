<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المواد بالصور والمواقع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="container mx-auto p-6 max-w-6xl">
        <!-- الشريط العلوي ومعلومات المستخدم -->
        <header class="bg-white p-4 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <div>
                حياك الله، <span id="displayUser" class="font-bold text-blue-600"></span> | 
                القسم: <span id="displayDept" class="font-bold text-gray-700"></span>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">تسجيل الخروج</button>
        </header>

        <!-- نموذج إضافة مادة مع اختيار/تصوير الصورة -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">إضافة مادة جديدة (صورة من الجهاز أو الكاميرا)</h2>
            <form id="itemForm" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                
                <!-- حقل رفع الصورة أو الكاميرا -->
                <div>
                    <label class="block text-xs text-gray-600 mb-1">صورة المادة (كاميرا أو ملف):</label>
                    <input type="file" id="itemImageFile" accept="image/*" capture="environment" required class="border p-1.5 rounded w-full text-xs bg-gray-50">
                </div>
                
                <div>
                    <label class="block text-xs text-gray-600 mb-1">مكان التخزين:</label>
                    <input type="text" id="itemLocation" placeholder="مثال: الثلاجة 1" required class="border p-2 rounded w-full text-sm">
                </div>
                
                <div>
                    <label class="block text-xs text-gray-600 mb-1">الكمية:</label>
                    <input type="number" id="itemQuantity" placeholder="الكمية" min="1" required class="border p-2 rounded w-full text-sm">
                </div>
                
                <div>
                    <label class="block text-xs text-gray-600 mb-1">تاريخ الانتهاء:</label>
                    <input type="date" id="itemExpiryDate" required class="border p-2 rounded w-full text-sm">
                </div>
                
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded hover:bg-blue-700 font-bold text-sm">حفظ المادة</button>
                </div>
            </form>
        </div>

        <!-- أزرار التصفية والتصدير -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">مخزون القسم والصور</h2>
            <button onclick="exportPDF()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold text-sm">
                📄 تصدير كشف القسم (PDF)
            </button>
        </div>

        <!-- جدول عرض المواد والصور -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full text-right border-collapse">
                <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
                    <tr>
                        <th class="p-3">صورة المادة</th>
                        <th class="p-3">مكان التخزين</th>
                        <th class="p-3">الكمية</th>
                        <th class="p-3">تاريخ الانتهاء</th>
                        <th class="p-3">الحالة</th>
                        <th class="p-3">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody" class="divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>
