<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المخازن</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">تسجيل دخول النظام</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm mb-2">اسم المستخدم / الموظف</label>
                <input type="text" id="username" required placeholder="مثال: Ahmed_Ali" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 text-sm mb-2">القسم المسؤول عنه</label>
                <select id="userDepartment" required class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">اختر القسم</option>
                    <option value="المواد الجافة">المواد الجافة</option>
                    <option value="المبردة والمجمدة">المبردة والمجمدة</option>
                    <option value="المنظفات والعناية">المنظفات والعناية</option>
                    <option value="المستودع العام">المستودع العام</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition font-bold">دخول لوحة التحكم</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const department = document.getElementById('userDepartment').value;

            sessionStorage.setItem('currentUser', username);
            sessionStorage.setItem('currentDept', department);

            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
