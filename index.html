<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المخازن السحابي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwt1K6LBGJmyTjx_219kc9xmZYldJ8rEo",
            authDomain: "ex-date-1db53.firebaseapp.com",
            projectId: "ex-date-1db53",
            storageBucket: "ex-date-1db53.firebasestorage.app",
            messagingSenderId: "367695041348",
            appId: "1:367695041348:web:d9d4695dd70606fb9dbd11",
            measurementId: "G-9CHBWJ6VGG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = async function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            try {
                // حساب المشرف الرئيسي الافتراضي
                if (u === 'admin' && p === '1234') {
                    sessionStorage.setItem('currentUser', 'admin');
                    sessionStorage.setItem('currentDept', 'الإدارة');
                    sessionStorage.setItem('userRole', 'admin');
                    window.location.href = 'admin.html';
                    return;
                }

                // البحث عن الموظفين في قاعدة البيانات السحابية
                const querySnapshot = await getDocs(collection(db, "users"));
                let foundUser = null;
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.username === u && data.pass === p) {
                        foundUser = data;
                    }
                });

                if (!foundUser) {
                    alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
                    return;
                }

                sessionStorage.setItem('currentUser', foundUser.username);
                sessionStorage.setItem('currentDept', foundUser.dept);
                sessionStorage.setItem('userRole', foundUser.role || 'employee');

                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error("خطأ في تسجيل الدخول: ", error);
                alert("حدث خطأ في الاتصال بقاعدة البيانات السحابية.");
            }
        };
    </script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">نظام إدارة المخازن السحابي</h2>
        
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm mb-2">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم" class="w-full border p-2.5 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 text-sm mb-2">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور" class="w-full border p-2.5 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700 transition font-bold shadow-md">تسجيل الدخول</button>
        </form>
    </div>

</body>
</html>
