<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المخازن</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">تسجيل دخول النظام</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm mb-2">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 text-sm mb-2">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور" class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition font-bold">دخول</button>
        </form>
    </div>

    <script>
        // تهيئة حساب الأدمن الافتراضي والأقسام أول مرة
        let users = JSON.parse(localStorage.getItem('users')) || [
            { username: 'admin', pass: '1234', dept: 'الإدارة', role: 'admin' }
        ];
        localStorage.setItem('users', JSON.stringify(users));

        let departments = JSON.parse(localStorage.getItem('departments')) || ['المواد الجافة', 'المبردة والمجمدة', 'المنظفات والعناية', 'المستودع العام'];
        localStorage.setItem('departments', JSON.stringify(departments));

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            const foundUser = users.find(user => user.username === u && user.pass === p);

            if (!foundUser) {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
                return;
            }

            sessionStorage.setItem('currentUser', foundUser.username);
            sessionStorage.setItem('currentDept', foundUser.dept);
            sessionStorage.setItem('userRole', foundUser.role);

            if (foundUser.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
