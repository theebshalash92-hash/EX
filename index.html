<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المخازن</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">JJ's Supermarket</h1>
            <p class="text-sm text-gray-500 mt-1">نظام إدارة المخازن والتنبيهات الذكية</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">اسم الموظف:</label>
                <input type="text" id="username" placeholder="اكتب اسمك هنا" required class="border p-3 rounded-xl w-full text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">القسم:</label>
                <select id="department" class="border p-3 rounded-xl w-full text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500">
                    <option value="منظفات">منظفات</option>
                    <option value="أغذية جافة">أغذية جافة</option>
                    <option value="ألبان وأجبان">ألبان وأجبان</option>
                    <option value="مشروبات">مشروبات</option>
                    <option value="مستلزمات منزلية">مستلزمات منزلية</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-3.5 rounded-xl font-bold text-sm shadow-lg hover:bg-blue-700 transition">
                دخول إلى لوحة التحكم
            </button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const department = document.getElementById('department').value;

            sessionStorage.setItem('currentUser', username);
            sessionStorage.setItem('currentDept', department);

            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
